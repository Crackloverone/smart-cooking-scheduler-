# 可选：用 80 端口反代到应用。
#
# 不装 nginx 也能用 —— 直接访问 http://<公网IP>:8000/app 就行（你同学那个形态）。
# 装 nginx 的收益只有一个：链接里不用带端口号，变成 http://<公网IP>/app。
#
# 启用：
#   sudo cp nginx-cooking-agent.conf /etc/nginx/sites-available/cooking-agent
#   sudo ln -sf /etc/nginx/sites-available/cooking-agent /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # 不删会看到 nginx 欢迎页
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ 国内服务器用 80 端口 + **域名**需要 ICP 备案；
#   用「IP + 端口」访问（本文件的 80 也是 IP 直访）不需要备案。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 用 IP 直访时不要写 server_name，保持默认即可
    server_name _;

    client_max_body_size 8m;

    # 访问日志单独放，排错时一眼能看到是不是打到了应用
    access_log /var/log/nginx/cooking-agent.access.log;
    error_log  /var/log/nginx/cooking-agent.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 这几个头必须带：应用生成绝对链接/取客户端 IP 时要用
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 首次请求要加载 2000 道菜库，给足余量（实测 <1s，但冷启动可能慢）
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
